name: Build FISHY Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project if missing
        run: |
          if [ ! -d "android" ]; then
            node node_modules/@capacitor/cli/bin/capacitor add android
          else
            echo "Android project already exists."
          fi

      - name: Sync Android
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Apply branding and fullscreen
        run: python3 scripts/prepare_android.py

      - name: Fix Android Manifest XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")

          if 'xmlns:android=' not in content:
              content = content.replace(
                  "<manifest",
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"',
                  1
              )
              manifest.write_text(content, encoding="utf-8")

          ET.parse(manifest)
          print("Android Manifest XML validated!")
          PY

      - name: Verify Android Manifest
        run: |
          echo "===== AndroidManifest.xml ====="
          cat android/app/src/main/AndroidManifest.xml

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("android/app/src/main/AndroidManifest.xml")
          print("AndroidManifest.xml is valid!")
          PY

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done

          echo "All signing secrets are configured."

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/fishy-release.jks"

          chmod 600 "$RUNNER_TEMP/fishy-release.jks"

          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/fishy-release.jks" \
            >> "$GITHUB_ENV"

          echo "Signing keystore restored."

      - name: Inject signing configuration
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/signing.py

      - name: Build APK and signed AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew

          ./gradlew --no-daemon assembleDebug bundleRelease --stacktrace

      - name: Verify AAB signature
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "::error::Release AAB not found!"
            exit 1
          fi

          jarsigner -verify -strict "$AAB"

          echo "AAB signature verified successfully!"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fishy-retro-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: fishy-retro-signed-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
