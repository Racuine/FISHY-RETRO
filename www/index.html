<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="theme-color" content="#48b9e0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Fishy! Retro V8 — Classements</title>
    <style>
        * {
            box-sizing: border-box
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #48b9e0;
            touch-action: none
        }

        body {
            display: grid;
            place-items: center;
            font-family: monospace
        }

        canvas {
            display: block;
            width: min(100vw,calc(100dvh * 0.6));
            height: min(100dvh,calc(100vw / 0.6));
            image-rendering: pixelated;
            touch-action: none
        }
    </style>
    <style>
        #online {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            background: #092d42e8;
            padding: 14px;
            font-family: monospace;
            color: #f8f3d5;
            touch-action: pan-y
        }

            #online.show {
                display: flex
            }

            #online .modal {
                width: min(95vw,390px);
                max-height: 92dvh;
                overflow-y: auto;
                background: #154661;
                border: 4px solid #0c2b40;
                box-shadow: 0 0 0 3px #4aacc6;
                padding: 17px;
                image-rendering: pixelated
            }

            #online h2 {
                margin: 2px 0 12px;
                color: #ffe58a;
                text-align: center;
                font-size: 21px
            }

            #online p {
                font-size: 12px;
                line-height: 1.5
            }

            #online label {
                display: block;
                font-size: 12px;
                margin: 11px 0 5px
            }

            #online input, #online select {
                display: block;
                width: 100%;
                border: 2px solid #80c5d8;
                border-radius: 0;
                padding: 11px;
                background: #ecfcff;
                color: #15374a;
                font: 15px monospace
            }

            #online button {
                background: #ffe58a;
                color: #12374a;
                border: 3px solid #8b6e37;
                font: bold 13px monospace;
                padding: 11px;
                cursor: pointer;
                margin: 6px 0;
                width: 100%;
                min-height: 42px
            }

                #online button.alt {
                    background: #a8e2ef;
                    border-color: #447b89
                }

                #online button:disabled {
                    opacity: .5
                }

            #online .small {
                font-size: 11px;
                color: #c8e8ee
            }

            #online .error {
                color: #ffe58a;
                min-height: 20px;
                font-size: 12px;
                line-height: 1.5
            }

            #online .tabs {
                display: flex;
                gap: 5px
            }

                #online .tabs button {
                    font-size: 11px
                }

            #online table {
                width: 100%;
                font-size: 12px;
                border-collapse: collapse
            }

            #online td, #online th {
                padding: 8px 3px;
                border-bottom: 1px solid #39758a;
                text-align: left
            }

                #online td:last-child, #online th:last-child {
                    text-align: right
                }

            #online .mine {
                background: #34637b
            }

            #online .profile {
                background: #1d536a;
                padding: 8px;
                margin: 8px 0;
                font-size: 12px
            }

            #online .hide {
                display: none
            }

            #online .shop-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 9px;
                margin: 12px 0
            }

            #online .shop-item {
                border: 2px solid #447b89;
                background: #0f374f;
                padding: 8px;
                text-align: center
            }

                #online .shop-item canvas {
                    width: 90px;
                    height: 62px;
                    margin: auto;
                    image-rendering: pixelated
                }

                #online .shop-item strong {
                    display: block;
                    font-size: 11px;
                    min-height: 27px
                }

                #online .shop-item button {
                    font-size: 10px;
                    padding: 5px;
                    min-height: 35px
                }

            #online .shop-tab {
                display: flex;
                gap: 5px
            }

                #online .shop-tab button {
                    font-size: 11px
                }
    </style>
</head>
<body>
    <canvas id="game" width="288" height="480" aria-label="Fishy! jeu rétro"></canvas>
    <div id="online" role="dialog" aria-modal="true" aria-label="Classement FISHY"><div class="modal" id="online-content"></div></div>
    <script src="config.js"></script>
    <script>
(()=>{'use strict';
const c=document.getElementById('game'),g=c.getContext('2d',{alpha:false});g.imageSmoothingEnabled=false;
const W=288,H=480,floor=446,fishX=75,fishR=11;
let state='ready',fishY=210,vy=0,score=0,best=0,frame=0,last=0,spawn=0,obstacles=[],bubbles=[],flash=0;
let muted=false,ac=null,nextBeat=0,beat=0;
// V7 economy: 1 coin per 10 points; connected rewards require server-created runs.
let localCoins=0,coins=0,runCoins=0,coinSync='ready';
try{localCoins=Math.max(0,Math.floor(Number(localStorage.getItem('fishy-retro-local-coins'))||0))}catch(e){}
coins=localCoins;
const newRunId=()=>globalThis.crypto?.randomUUID?.()||'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.floor(Math.random()*16);return(c==='x'?r:(r&3|8)).toString(16)});
let runId=newRunId();
// A connected run is registered server-side before it can earn coins.
let serverRunPromise=null;

const collection=[
{name:'FISHY CLASSIC',need:0,body:'#ffbb4b',light:'#ffd36e',fin:'#ff8b4b',accent:'#f19b43'},
{name:'BLUE FIN',need:30,body:'#217dc8',light:'#64d4ff',fin:'#165baf',accent:'#b2f5ff'},
{name:'CLOWNY',need:80,body:'#ed662e',light:'#ffad5c',fin:'#b84425',accent:'#ffffff',stripe:true},
{name:'ROYAL FIN',need:150,body:'#7647c6',light:'#c494ff',fin:'#4935a1',accent:'#f7d4ff'},
{name:'GOLDEN FISH',need:250,body:'#d39a13',light:'#ffe66a',fin:'#a8750d',accent:'#fff5ae'},
{name:'TOXIC FIN',need:370,body:'#36a52b',light:'#b5ff4d',fin:'#1b7d46',accent:'#e6ff94'},
{name:'RAINBOW FISH',need:500,body:'#ee537e',light:'#ffe061',fin:'#55c4e6',accent:'#b98bff',rainbow:true},
{name:'SHADOW FISH',need:700,body:'#23253e',light:'#5b517a',fin:'#141a2e',accent:'#ff4d65',redEye:true},
{name:'CRYSTAL FISH',need:900,body:'#8ee4ff',light:'#e5fcff',fin:'#4aa9d6',accent:'#ffffff'},
{name:'COSMIC FISH',need:1000,body:'#653ab2',light:'#e6b3ff',fin:'#2e1e7a',accent:'#ffe66a',cosmic:true}
,{name:'NEON FISH',kind:'coins',price:50,body:'#16dfd6',light:'#a5ffff',fin:'#e63fff',accent:'#fff26d',cosmic:true}
,{name:'CORAL FISH',kind:'coins',price:100,body:'#ff786f',light:'#ffba98',fin:'#eb4566',accent:'#fff2c4'}
,{name:'PIRATE FISH',kind:'coins',price:150,body:'#444653',light:'#969eaf',fin:'#272936',accent:'#ffe08b',redEye:true}
,{name:'ICE FISH',kind:'coins',price:200,body:'#5bc6ff',light:'#e2ffff',fin:'#3886e5',accent:'#ffffff'}
,{name:'LAVA FISH',kind:'coins',price:300,body:'#ec4a28',light:'#ffb33c',fin:'#942728',accent:'#ffe55b',cosmic:true}
,{name:'ELECTRIC FISH',kind:'coins',price:400,body:'#ffdb26',light:'#fff59b',fin:'#4b79ec',accent:'#ffffff',stripe:true}
,{name:'SAKURA FISH',kind:'coins',price:500,body:'#ee8cc8',light:'#ffd8ed',fin:'#c34c9d',accent:'#ffffff'}
,{name:'GHOST FISH',kind:'coins',price:650,body:'#b7d7e2',light:'#ffffff',fin:'#7da3b6',accent:'#e4faff',redEye:true}
,{name:'GALAXY FISH',kind:'coins',price:800,body:'#5838a3',light:'#aa85f7',fin:'#251d6b',accent:'#ffe28b',cosmic:true}
,{name:'DRAGON FISH',kind:'coins',price:1000,body:'#2c9a60',light:'#a4e98b',fin:'#196443',accent:'#ffe184',stripe:true}
,{name:'BRONZE FISH',kind:'premium',eur:'0,99',body:'#ae7147',light:'#e7ad79',fin:'#73472e',accent:'#ffdfb0'}
,{name:'SILVER FISH',kind:'premium',eur:'1,49',body:'#98a8b9',light:'#eef7ff',fin:'#657a8c',accent:'#ffffff'}
,{name:'GOLD FISH',kind:'premium',eur:'1,99',body:'#c89b1d',light:'#fff3a3',fin:'#a16c13',accent:'#ffffff',cosmic:true}
,{name:'PLATINUM FISH',kind:'premium',eur:'2,49',body:'#a2c6d5',light:'#f5ffff',fin:'#739cae',accent:'#e7f8ff'}
,{name:'EMERALD FISH',kind:'premium',eur:'2,99',body:'#168c58',light:'#63e6a5',fin:'#07583e',accent:'#caffdf',cosmic:true}
,{name:'RUBY FISH',kind:'premium',eur:'2,99',body:'#bf2948',light:'#ff7c93',fin:'#7d1535',accent:'#ffced5',cosmic:true}
,{name:'SAPPHIRE FISH',kind:'premium',eur:'3,49',body:'#1d52bd',light:'#77b4ff',fin:'#12317e',accent:'#d9f3ff',cosmic:true}
,{name:'AMETHYST FISH',kind:'premium',eur:'3,49',body:'#8536b9',light:'#dda0ff',fin:'#522274',accent:'#f9dcff',cosmic:true}
,{name:'DIAMOND FISH',kind:'premium',eur:'3,99',body:'#b8eaff',light:'#ffffff',fin:'#76b9e2',accent:'#ffffff',cosmic:true}
,{name:'BLACK DIAMOND',kind:'premium',eur:'4,99',body:'#202537',light:'#7686aa',fin:'#101421',accent:'#c8e8ff',cosmic:true,redEye:true}
];
let selected=0,collectionPage=0,newUnlock=-1,unlockToast=-1,unlockTimer=0,unlockBurst=[],swimParticles=[],recordToast=0,recordCelebrated=false,runStartBest=0,helpSeen=false,helpFrom='ready';
try{selected=Number(localStorage.getItem('fishy-retro-selected'))||0}catch(e){};
if(!collection[selected])selected=0;
function saveSelection(){try{localStorage.setItem(selectKey(),String(selected))}catch(e){}}
function unlockedCount(){return collection.slice(0,10).filter(f=>best>=f.need).length}

// The anonymous record belongs to this device; signed-in records belong to Supabase profiles.
let localBest=0;
try{localBest=Math.max(0,Number(localStorage.getItem('fishy-retro-local-best')??localStorage.getItem('fishy-retro-best'))||0);muted=localStorage.getItem('fishy-retro-muted')==='1';localStorage.setItem('fishy-retro-local-best',String(localBest))}catch(e){}
best=localBest;
if(selected>=10 || best<collection[selected].need)selected=0;
try{helpSeen=localStorage.getItem('fishy-retro-help-seen')==='1'}catch(e){}
function audio(){if(muted)return null;try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
function tone(freq,duration=.09,type='square',volume=.025,when){const a=audio();if(!a)return;const t=when??a.currentTime;try{const o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(volume,t+.009);v.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(v);v.connect(a.destination);o.start(t);o.stop(t+duration+.01)}catch(e){}}
function music(){if(state!=='play'||muted||!ac||ac.state!=='running')return;const notes=[196,0,247,0,294,0,247,0,220,0,262,0,330,0,262,0];let n=0;while(nextBeat<ac.currentTime+.08&&n++<4){if(nextBeat<ac.currentTime)nextBeat=ac.currentTime+.01;let f=notes[beat%notes.length];if(f)tone(f,.12,'triangle',.012,nextBeat);if(beat%4===0)tone(98,.07,'sine',.009,nextBeat);nextBeat+=.19;beat++}}
function startMusic(){if(!audio())return;nextBeat=ac.currentTime+.03;beat=0}
function sfx(kind){if(kind==='swim')tone(440,.055,'square',.016);else if(kind==='point'){tone(660,.09,'square',.035);tone(880,.11,'square',.025,ac?ac.currentTime+.09:undefined)}else if(kind==='die'){tone(170,.24,'sawtooth',.04)}else if(kind==='pause')tone(350,.08,'triangle',.02);else if(kind==='record'){const a=audio();if(a){const t=a.currentTime+.02;[659,880,1047].forEach((f,i)=>tone(f,.12,'triangle',.025,t+i*.09))}}else if(kind==='unlock'){const a=audio();if(a){const t=a.currentTime+.02;[523,659,784,1047].forEach((f,i)=>tone(f,.17,'square',.025,t+i*.105))}}}
function rnd(a,b){return a+Math.random()*(b-a)}
function reset(){runCoins=0;coinSync='ready';runId=newRunId();unlockToast=-1;unlockTimer=0;unlockBurst=[];swimParticles=[];recordToast=0;recordCelebrated=false;state='ready';fishY=210;vy=0;score=0;frame=0;spawn=0;obstacles=[];bubbles=[];flash=0}
function begin(){
         reset();runStartBest=best;newUnlock=-1;state='play';vy=-3.9;startMusic();sfx('swim');
         serverRunPromise=null;
         if(session&&configured){
          const id=session.user.id,rid=runId;
          serverRunPromise=rpc('fishy_start_run',{p_run_id:rid}).then(()=>true).catch(e=>{console.warn('Partie non validée côté serveur :',e.message);return false});
         }
}
function pause(){if(state==='play'){state='paused';sfx('pause')}else if(state==='paused'){state='play';startMusic();sfx('pause')}}
function openHelp(from){helpFrom=from;state='help'}
function tap(x,y){
                 if(state==='help'){if(y>=342&&y<=402){try{localStorage.setItem('fishy-retro-help-seen','1')}catch(e){}helpSeen=true;if(helpFrom==='ready')begin();else state=helpFrom}return}
                 if(state==='collection'){
                  if(y<80){state='ready';return}
                  if(y>=91&&y<=360){const col=Math.floor((x-17)/128),row=Math.floor((y-91)/91);if(col>=0&&col<2&&row>=0&&row<3){const idx=collectionPage*6+row*2+col;if(idx<10&&best>=collection[idx].need){selected=idx;saveSelection();sfx('point')}}return}
                  if(y>370){collectionPage=1-collectionPage;return}
                  return
                 }
                 if(state==='paused'){
                  if(y>=188&&y<=240){pause();return}
                  if(y>=247&&y<=293){reset();return}
                  if(y>=300&&y<=345){openHelp('paused');return}
                  return
                 }
                 if(state==='ready'){
                  if(y>=397&&y<=442){setTimeout(openLeaderboard,0);return}
                  if(y>=225&&y<=279){if(!helpSeen)openHelp('ready');else begin();return}
                  if(y>=291&&y<=339){state='collection';collectionPage=0;return}
                  if(y>=349&&y<=395){openShop();return}
                  if(y<48&&x<54){openHelp('ready');return}
                  if(y<48&&x>W-54){toggleSound();return}
                  return
                 }
                 if(state==='dead'){
                  if(y>=425&&y<=472){setTimeout(openLeaderboard,0);return}
                  if(y>=319&&y<=363){begin();return}
                  if(y>=374&&y<=420){openShop();return}
                  return
                 }
                 if(y<48&&x<54&&state==='play'){pause();return}
                 if(y<48&&x>W-54){toggleSound();return}
                 if(state==='play'){vy=-3.9;sfx('swim');emitSwim()}
}
function toggleSound(){muted=!muted;try{localStorage.setItem('fishy-retro-muted',muted?'1':'0')}catch(e){}if(!muted){audio();if(state==='play')startMusic()}}
function pointer(e){if(document.getElementById('online').classList.contains('show'))return;e.preventDefault();const r=c.getBoundingClientRect();tap((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height)}
// Gameplay reacts instantly on finger contact; menus are handled on release.
// Leaderboard opening is deferred to the next task so the Android synthesized
// click cannot land on a newly inserted modal button.
let gamePointerId=null;
c.addEventListener('pointerdown',e=>{
                 if(modal.classList.contains('show'))return;
                 if(state==='play'){
                  gamePointerId=e.pointerId;
                  pointer(e);
                 }
},{passive:false});
c.addEventListener('pointerup',e=>{
                 if(e.pointerId===gamePointerId){gamePointerId=null;return;}
                 pointer(e);
},{passive:false});
c.addEventListener('pointercancel',e=>{if(e.pointerId===gamePointerId)gamePointerId=null;});
window.addEventListener('keydown',e=>{if(document.getElementById('online').classList.contains('show'))return;if(['Space','ArrowUp','KeyP','Escape','KeyM'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='KeyP'||e.code==='Escape'){if(state==='help'){state=helpFrom}else if(state==='collection'){state='ready'}else pause();return}if(e.code==='KeyM'){toggleSound();return}if(e.code==='Space'||e.code==='ArrowUp'){if(state==='ready'){if(!helpSeen)openHelp('ready');else begin()}else if(state==='dead')begin();else if(state==='help'){helpSeen=true;try{localStorage.setItem('fishy-retro-help-seen','1')}catch(e){}if(helpFrom==='ready')begin();else state=helpFrom}else if(state==='paused')pause();else tap(W/2,H/2)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')state='paused'});
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
function text(t,x,y,size=14,color='#fff',align='center'){g.font=`bold ${size}px monospace`;g.textAlign=align;g.fillStyle='#12344b';g.fillText(t,x+1,y+2);g.fillStyle=color;g.fillText(t,x,y)}
function seaweed(x,tip,bottom,top){const w=34;rect(x,top,w,Math.max(0,bottom-top),'#175c50');rect(x+5,top+5,w-10,Math.max(0,bottom-top-10),'#27996d');for(let y=top+5;y<bottom-8;y+=23){rect(x-6,y+8,12,6,'#1b7a59');rect(x+28,y+14,12,6,'#1b7a59')}rect(x+11,top+2,6,Math.max(0,bottom-top-4),'#56c38c');if(tip==='down')rect(x-3,bottom-9,40,9,'#164b48');else rect(x-3,top,40,9,'#164b48')}
function drawFishSprite(x,y,index,scale=1,tilt=0){const f=collection[index];g.save();g.translate(Math.round(x),Math.round(y));g.rotate(tilt);g.scale(scale,scale);
rect(-10,-8,19,16,f.body);rect(-8,-6,16,12,f.light);const wag=Math.round(Math.sin(frame*.29)*3);rect(-16-wag,-7,8,5,f.fin);rect(-16+wag,2,8,5,f.fin);rect(-2,-12,7,5,f.accent);
if(f.stripe){rect(-4,-7,3,14,'#ffffff');rect(1,-6,3,12,'#ffffff')}
if(f.rainbow){rect(-7,-5,4,10,'#75e89a');rect(-2,-5,4,10,'#6ac6ff');rect(3,-5,3,10,'#b68aff')}
if(f.cosmic){rect(-8,-5,2,2,'#fff3aa');rect(-3,3,2,2,'#fff3aa');rect(1,-6,2,2,'#fff3aa')}
rect(4,-3,4,4,f.redEye?'#ff4d65':'#18354c');rect(5,-2,1,1,'#ffffff');rect(8,4,3,2,f.fin);g.restore()}
function emitSwim(){if(swimParticles.length>20)return;for(let i=0;i<3;i++)swimParticles.push({x:fishX-14,y:fishY+rnd(-5,5),vx:rnd(-1.25,-.45),vy:rnd(-.6,.6),life:22+rnd(0,12),r:i===0?2:1})}
function fish(){if(collection[selected].cosmic&&state==='play'){for(let i=0;i<3;i++){const x=fishX-20-i*8-(frame*.6%8),y=fishY+Math.sin(frame*.1+i*3)*7;rect(x,y,2,2,i%2?'#f8e581':'#d9aaff')}}drawFishSprite(fishX,fishY,selected,1,Math.max(-.35,Math.min(.6,vy*.075)))}

function celebrateUnlock(i){newUnlock=i;unlockToast=i;unlockTimer=145;unlockBurst=Array.from({length:9},(_,j)=>({x:38+rnd(-10,30),y:87+rnd(-12,12),vx:rnd(-.35,.35),vy:rnd(-.55,-.1),life:rnd(25,55),color:['#ffe58a','#fff9d1','#8cf5ff','#f8a9ff'][j%4]}));sfx('unlock')}
function die(){
         if(state==='dead')return;
         state='dead';flash=8;recordToast=0;sfx('die');
         runCoins=Math.floor(Math.max(0,score)/10);
         // Never make a network request on the gameplay input path.
         if(!session){
          localCoins+=runCoins;coins=localCoins;
          try{localStorage.setItem('fishy-retro-local-coins',String(localCoins))}catch(e){}
          coinSync='ready';
         }else if(runCoins>0){
          coinSync='pending';
          const id=session.user.id,rid=runId,finalScore=score,registration=serverRunPromise;
          // Wait for the server to register the run, then submit its completion once.
          void (async()=>{
           const registered=registration?await registration:false;
           if(!registered||session?.user?.id!==id){coinSync='error';return}
           queueCoinReward(id,rid,finalScore);
           await syncCoinRewards(id);
          })();
         }
         submitRecord(score);
}
function medal(n){return n>=250?['DIAMOND','#b5faff']:n>=100?['OR','#ffe08b']:n>=30?['SILVER','#e4edf4']:n>=10?['BRONZE','#f4b27a']:['BEGINNER','#b4e6e4']}
function update(dt){if(state==='paused')return;frame+=dt;flash=Math.max(0,flash-dt);recordToast=Math.max(0,recordToast-dt);for(const p of swimParticles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}swimParticles=swimParticles.filter(p=>p.life>0);if(unlockTimer>0){unlockTimer=Math.max(0,unlockTimer-dt);for(const p of unlockBurst){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.025*dt;p.life-=dt}unlockBurst=unlockBurst.filter(p=>p.life>0);if(unlockTimer===0)unlockToast=-1;}
if(bubbles.length<35&&Math.random()<.14*dt)bubbles.push({x:rnd(8,280),y:480,r:rnd(1,3),v:rnd(.35,.95)});
for(const b of bubbles)b.y-=b.v*dt;bubbles=bubbles.filter(b=>b.y>-8);
if(state!=='play')return;
vy=Math.min(4.6,vy+.21*dt);fishY+=vy*dt;
spawn+=dt;const interval=Math.max(76,112-score*1.1);

async function buySkin(i){
         const f=collection[i];if(!f||shopBusy)return;
         if(f.kind==='premium'){await buyPremiumSkin(i);return}
         if(f.kind!=='coins')return;
         if(ownedSkins.has(i)){selectSkin(i);return}
         if(coins<f.price){errorOnline('Not enough coins!');return}
         if(!confirm('Buy '+f.name+' for '+f.price+' coins?'))return;
         shopBusy=true;renderShop();
         try{
          if(session){
           if(getPendingCoins(session.user.id).length){throw Error('Wait for pending rewards to sync before buying.')}
           const result=await rpc('fishy_buy_skin',{p_skin_id:i});coins=Number(result);ownedSkins.add(i);saveOwned();
          }else{localCoins-=f.price;coins=localCoins;localStorage.setItem('fishy-retro-local-coins',String(localCoins));ownedSkins.add(i);saveOwned()}
          selected=i;saveSelection();localStorage.setItem(selectKey(),String(i));sfx('unlock');
         }catch(e){errorOnline(e.message);shopBusy=false;return}
         shopBusy=false;renderShop();
}

// Google Play Billing: the native purchase token is verified server-side before unlocking.
const PREMIUM_IDS={20:'fishy_bronze',21:'fishy_silver',22:'fishy_gold',23:'fishy_platinum',24:'fishy_emerald',25:'fishy_ruby',26:'fishy_sapphire',27:'fishy_amethyst',28:'fishy_diamond',29:'fishy_black_diamond'};
const billing=()=>window.Capacitor?.Plugins?.FishyBilling;
async function verifyPremiumPurchase(purchase){
 if(!session)throw Error('Sign in before confirming a purchase.');
 await refresh();
 if(!session)throw Error('Session expired. Please sign in again.');
 const r=await fetch(endpoint+'/functions/v1/verify-fishy-purchase',{method:'POST',headers:{'apikey':anon,'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({productId:purchase.productId,purchaseToken:purchase.purchaseToken})});
 const data=await r.json().catch(()=>({}));
 if(!r.ok||!data.ok)throw Error(data.error||'Google Play verification failed');
 await loadShopOwned();
 return data;
}
async function buyPremiumSkin(i){
 if(shopBusy)return;
 if(ownedSkins.has(i)){selectSkin(i);return}
 if(!session||!profile){errorOnline('Sign in through LEADERBOARD before buying premium skins.');return}
 if(!billing()){errorOnline('Google Play purchases are only available in the Android app.');return}
 const productId=PREMIUM_IDS[i];if(!productId)return;
 shopBusy=true;renderShop();
 try{
  const purchase=await billing().purchase({productId});
  if(purchase.pending){errorOnline('Payment pending. Your fish will unlock after confirmation.');return}
  await verifyPremiumPurchase(purchase);
  selected=i;saveSelection();localStorage.setItem(selectKey(),String(i));sfx('unlock');
 }catch(e){errorOnline(e.message||String(e));}
 finally{shopBusy=false;renderShop()}
}
async function restorePremiumPurchases(silent=false){
 if(!session||!billing())return;
 try{
  const result=await billing().restorePurchases();
  for(const p of result.purchases||[]){if(PREMIUM_IDS[Object.keys(PREMIUM_IDS).find(k=>PREMIUM_IDS[k]===p.productId)]&&p.purchaseToken){try{await verifyPremiumPurchase(p)}catch(e){console.warn('Purchase restoration:',e.message)}}}
  await loadShopOwned();if(document.getElementById('shop-grid'))renderShop();
 }catch(e){if(!silent)errorOnline('Restauration impossible : '+e.message)}
}
const pendingKey=id=>'fishy-v5-pending-'+id;
function getPendingCoins(id){try{const rows=JSON.parse(localStorage.getItem(pendingKey(id))||'[]');return Array.isArray(rows)?rows:[]}catch(e){return []}}
function queueCoinReward(id,uuid,value){
         try{const rows=getPendingCoins(id);if(!rows.some(x=>x.id===uuid))rows.push({id:uuid,score:value});localStorage.setItem(pendingKey(id),JSON.stringify(rows))}
         catch(e){console.warn('Could not store pending reward',e)}
}
async function loadCoinWallet(){
         if(!session){coins=localCoins;return}
         const id=session.user.id;
         try{
          const result=await rpc('fishy_coin_balance');
          if(session?.user?.id===id)coins=Math.max(0,Number(result)||0);
          void syncCoinRewards(id);
         }catch(e){console.warn('Wallet unavailable (check Supabase SQL setup)',e.message)}
}
async function syncCoinRewards(id){
         if(coinSyncRunning||!session||session.user.id!==id)return;
         coinSyncRunning=true;
         try{
          let rows=getPendingCoins(id);
          for(const reward of rows){
           if(!session||session.user.id!==id)break;
           // RPC checks server-created run, elapsed time, ownership, and idempotency.
           const total=await rpc('fishy_finish_run',{p_run_id:reward.id,p_score:reward.score});
           if(session?.user?.id===id){
            coins=Math.max(0,Number(total)||0);
            rows=getPendingCoins(id).filter(x=>x.id!==reward.id);
            localStorage.setItem(pendingKey(id),JSON.stringify(rows));
            coinSync=rows.length?'pending':'ready';
           }
          }
         }catch(e){if(session?.user?.id===id)coinSync='error';console.warn('Coins en attente de synchronisation :',e.message)}
         finally{coinSyncRunning=false}
}

const countryName=code=>countries.find(x=>x[0]===code)?.[1]||('🌍 '+code);
function showOnline(html){content.innerHTML=html;modal.classList.add('show')}
function closeOnline(){modal.classList.remove('show');content.innerHTML=''}
function errorOnline(msg){const e=document.getElementById('online-error');if(e)e.textContent=msg}
function getStored(){try{return JSON.parse(localStorage.getItem('fishy-v8-session')||'null')}catch(e){return null}}
function applyRecordScope(){
                 // Never mix a device-only record with a signed-in player's record.
                 best=session?Math.max(0,Number(profile?.best_score)||0):localBest;
                 if(!session){coins=localCoins;coinSync='ready'}else{coins=0;coinSync='ready'}
                 restoreSkinScope()
}
function saveSession(s){session=s;if(!s){profile=null;applyRecordScope()}try{if(s)localStorage.setItem('fishy-v8-session',JSON.stringify(s));else localStorage.removeItem('fishy-v8-session')}catch(e){}}
async function api(path,method='GET',body=null,token=null){
                 if(!configured)throw Error('Supabase is not configured. See the project README.');
                 const headers={'apikey':anon,'Content-Type':'application/json'};
                 if(token||session?.access_token)headers.Authorization='Bearer '+(token||session.access_token);
                 const response=await fetch(endpoint+path,{method,headers,body:body===null?undefined:JSON.stringify(body)});
                 const raw=await response.text();let data;try{data=raw?JSON.parse(raw):null}catch(e){data=null}
                 if(!response.ok)throw Error(data?.msg||data?.error_description||data?.message||data?.error||('Network error '+response.status));
                 return data;
}
async function refresh(){
                 if(!session)return false;
                 if(Date.now()<session.expires_at-60000)return true;
                 try{const r=await api('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:session.refresh_token});saveSession({...r,expires_at:Date.now()+r.expires_in*1000});return true}
                 catch(e){saveSession(null);profile=null;return false}
}
async function rpc(name,args={}){await refresh();return api('/rest/v1/rpc/'+name,'POST',args)}
async function loadProfile(){if(!session)return null;await refresh();if(!session)return null;const rows=await api('/rest/v1/profiles?select=id,username,country,best_score&id=eq.'+encodeURIComponent(session.user.id));profile=rows?.[0]||null;applyRecordScope();await loadCoinWallet();try{await loadShopOwned()}catch(e){console.warn("Skins indisponibles:",e.message)}return profile}
async function openLeaderboard(){onlineFrom=state;if(state==='play')state='paused';if(!configured){showOnline('<h2>🌍 LEADERBOARD</h2><p>Online leaderboards require Supabase configuration.</p><p class="small">Set up www/config.js and run the SQL included in the ZIP.</p><button id="close-online">BACK TO GAME</button>');document.getElementById('close-online').onclick=leaveOnline;return}
                 showOnline('<h2>🌍 LEADERBOARD</h2><p>Connecting to server...</p>');try{await loadProfile();if(!session)renderLogin();else if(!profile)renderCreateProfile();else await renderRanking()}catch(e){showOnline('<h2>CONNECTION FAILED</h2><p>'+esc(e.message)+'</p><button id="close-online">RETOUR</button>');document.getElementById('close-online').onclick=leaveOnline}}
function leaveOnline(){closeOnline();if(onlineFrom==='play')state='paused'}
function renderLogin(mode='login'){
                 const signup=mode==='signup';
                 showOnline(`<h2>🐟 ${signup?'CREATE ACCOUNT':'MY PROFILE'}</h2><p>${signup?'Create your FISHY! RETRO account using email and a password.':'Sign in to access your personal best and rankings.'}</p><form id="email-auth-form"><label>E-MAIL</label><input id="login-email" type="email" autocomplete="email" placeholder="toi@exemple.com" maxlength="254" required><label>PASSWORD</label><input id="login-password" type="password" autocomplete="${signup?'new-password':'current-password'}" placeholder="At least 8 characters" minlength="8" required><button id="email-submit" type="submit">${signup?'CREATE ACCOUNT':'SIGN IN'}</button></form><button id="switch-email-mode" class="alt">${signup?'I HAVE AN ACCOUNT':'CREATE ACCOUNT E-MAIL'}</button><button id="google-login" class="alt">SIGN IN WITH GOOGLE</button><p class="small">${signup?'Email confirmation is not required if disabled in Supabase. Use an email address you own.':'Your password is never stored by the game. Password recovery by email may be limited without SMTP.'}</p><p id="online-error" class="error" role="alert"></p><button id="close-online" class="alt">RETOUR</button>`);
                 document.getElementById('email-auth-form').onsubmit=e=>{e.preventDefault();emailPasswordAuth(mode)};
                 document.getElementById('switch-email-mode').onclick=()=>renderLogin(signup?'login':'signup');
                 document.getElementById('google-login').onclick=googleLogin;
                 document.getElementById('close-online').onclick=leaveOnline;
}
async function emailPasswordAuth(mode){
                 const email=document.getElementById('login-email').value.trim(),password=document.getElementById('login-password').value;
                 if(!/^\S+@\S+\.\S+$/.test(email)){errorOnline('Invalid email address.');return}
                 if(password.length<8){errorOnline('Password must be at least 8 characters.');return}
                 const button=document.getElementById('email-submit');button.disabled=true;button.textContent='SIGNING IN...';
                 try{
                  if(mode==='signup'){
                   const result=await api('/auth/v1/signup','POST',{email,password});
                   if(!result?.access_token){errorOnline('Account created, but email confirmation is required. Check Supabase Authentication > Providers > Email settings.');return}
                   await acceptAuth(result);
                  }else{
                   const result=await api('/auth/v1/token?grant_type=password','POST',{email,password});
                   await acceptAuth(result);
                  }
                 }catch(e){const msg=String(e.message||'');errorOnline(/email rate limit exceeded|over_email_send_rate_limit/i.test(msg)?'Supabase is still trying to send a confirmation email. Check the email confirmation settings and your Supabase project configuration.':msg==='Invalid login credentials'?'Incorrect credentials or Google-only account.':msg)}
                 finally{if(button.isConnected){button.disabled=false;button.textContent=mode==='signup'?'CREATE ACCOUNT':'SIGN IN'}}
}
async function acceptAuth(data){if(!data?.access_token||!data?.user)throw Error('Incomplete sign-in response.');saveSession({...data,expires_at:Date.now()+(data.expires_in||3600)*1000});await loadProfile();if(profile)await renderRanking();else renderCreateProfile()}
function renderCreateProfile(){showOnline(`<h2>🌍 CREATE YOUR PROFILE</h2><p>Choose a unique username and your country. <b>Your country cannot be changed later.</b></p><label>USERNAME (3–16 CHARACTERS)</label><input id="new-username" maxlength="16" placeholder="FishMaster" autocomplete="off"><label>COUNTRY (PERMANENT)</label><select id="new-country">${countries.map(([code,name])=>`<option value="${code}">${name}</option>`).join('')}</select><p class="small">Your account ID stays private. Only your username, country, and best score are public.</p><button id="create-profile">CONFIRMER MY PROFILE</button><p id="online-error" class="error"></p><button id="logout" class="alt">SIGN OUT</button>`);
                 document.getElementById('create-profile').onclick=async()=>{const username=document.getElementById('new-username').value.trim(),country=document.getElementById('new-country').value;if(!/^[a-zA-Z0-9_]{3,16}$/.test(username)){errorOnline('Use 3–16 characters: letters, digits and underscore only.');return}if(!confirm('Confirm country '+countryName(country)+'? You cannot change it later.'))return;try{await rpc('create_fishy_profile',{p_username:username,p_country:country});await loadProfile();await renderRanking()}catch(e){errorOnline(e.message.includes('unique')?'Username already taken. Try another.':e.message)}};
                 document.getElementById('logout').onclick=logout}
async function renderRanking(){rankingScope=rankingScope==='country'?'country':'world';showOnline(`<h2>🏆 LEADERBOARD</h2><div class="profile">${esc(profile.username)} · ${esc(countryName(profile.country))}<br>Your online best: <b>${profile.best_score}</b></div><div class="tabs"><button id="rank-world">🌍 WORLD</button><button id="rank-country">${esc(profile.country)} MY COUNTRY</button></div><div id="rank-content"><p>Loading...</p></div><button id="rank-refresh" class="alt">REFRESH</button><button id="logout" class="alt">SIGN OUT</button><button id="close-online">RETOUR</button>`);
                 document.getElementById('rank-world').onclick=()=>{rankingScope='world';fetchRanks()};document.getElementById('rank-country').onclick=()=>{rankingScope='country';fetchRanks()};document.getElementById('rank-refresh').onclick=fetchRanks;document.getElementById('logout').onclick=logout;document.getElementById('close-online').onclick=leaveOnline;await fetchRanks()}
async function fetchRanks(){const target=document.getElementById('rank-content');if(!target)return;target.innerHTML='<p>Loading...</p>';try{const country=rankingScope==='country'?profile.country:null;const [rows,own]=await Promise.all([rpc('fishy_leaderboard',{p_country:country,p_limit:100}),rpc('fishy_my_rank',{p_country:country})]);const medals=['🥇','🥈','🥉'];target.innerHTML=`<p class="small">TOP 100 ${rankingScope==='world'?'WORLD':esc(countryName(profile.country))}</p><table><thead><tr><th>#</th><th>JOUEUR</th><th>SCORE</th></tr></thead><tbody>${(rows||[]).map((r,i)=>`<tr class="${r.username===profile.username?'mine':''}"><td>${medals[i]||r.position}</td><td>${esc(countryName(r.country).split(' ')[0])} ${esc(r.username)}</td><td>${r.best_score}</td></tr>`).join('')||'<tr><td colspan="3">Aucun score</td></tr>'}</tbody></table><p class="profile">YOUR RANK : <b>${own?.[0]?.position?'#'+own[0].position:'Unranked'}</b> · ${profile.best_score} points</p>`}catch(e){target.innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
async function logout(){try{if(session)await api('/auth/v1/logout','POST',{})}catch(e){}saveSession(null);renderLogin()}
async function submitRecord(value){
                 if(!configured||!session||!profile||!Number.isSafeInteger(value)||value<=Number(profile.best_score))return;
                 const userId=session.user.id;
                 try{
                  await rpc('submit_fishy_score',{p_score:value});
                  if(session?.user?.id===userId){profile.best_score=Math.max(Number(profile.best_score)||0,value);best=Math.max(best,profile.best_score)}
                 }catch(e){console.warn('Score not synced:',e.message)}
}
const OAUTH_CALLBACK='fishyretro://auth/callback';
async function googleLogin(){
                 if(!configured)return;
                 const native=!!window.Capacitor?.isNativePlatform?.();
                 const redirect=native?OAUTH_CALLBACK:location.origin+location.pathname;
                 const url=endpoint+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(redirect);
                 try{
                  if(native){
                   const browser=window.Capacitor?.Plugins?.Browser;
                   if(!browser)throw Error('Plugin Capacitor Browser indisponible.');
                   await browser.open({url});
                  }else location.assign(url);
                 }catch(e){errorOnline('Google sign-in failed: '+e.message)}
}
async function oauthCallback(url){
                 try{
                  const u=new URL(url),hash=new URLSearchParams(u.hash.slice(1)),query=u.searchParams;
                  if(hash.get('error')||query.get('error'))throw Error(hash.get('error_description')||query.get('error_description')||'Google OAuth');
                  const token=hash.get('access_token'),refreshToken=hash.get('refresh_token');
                  if(!token||!refreshToken){
                   if(query.get('code'))throw Error('The server returned a PKCE code, but this build expects OAuth tokens. Check Supabase OAuth flow settings.');
                   throw Error('OAuth callback did not contain sign-in tokens.');
                  }
                  const user=await api('/auth/v1/user','GET',null,token);
                  await acceptAuth({access_token:token,refresh_token:refreshToken,user,expires_in:Number(hash.get('expires_in')||3600)});
                  try{await window.Capacitor?.Plugins?.Browser?.close()}catch(e){}
                  if(!window.Capacitor?.isNativePlatform?.())history.replaceState(null,'',location.pathname);
                 }catch(e){showOnline('<h2>GOOGLE SIGN-IN</h2><p>'+esc(e.message)+'</p><button id="close-online">RETOUR</button>');document.getElementById('close-online').onclick=leaveOnline}
}
try{
                 const app=window.Capacitor?.Plugins?.App;
                 app?.addListener('appUrlOpen',({url})=>{
                  if(url?.startsWith(OAUTH_CALLBACK))oauthCallback(url);
                 });
                 app?.getLaunchUrl?.().then(result=>{
                  if(result?.url?.startsWith(OAUTH_CALLBACK))oauthCallback(result.url);
                 }).catch(e=>console.warn('OAuth launch URL:',e));
}catch(e){console.warn('OAuth deep link listener:',e)}
if(location.hash.includes('access_token='))oauthCallback(location.href);
session=getStored();restoreSkinScope();
// A stored session must be validated and its own score fetched before showing a record.
if(session){best=0;coins=0;loadProfile().catch(e=>console.warn('Profile could not be loaded:',e.message))}
// Propose profile creation on first launch when online mode is configured.
if(configured&&!session){let dismissed=false;try{dismissed=localStorage.getItem('fishy-v8-welcome-dismissed')==='1'}catch(e){}if(!dismissed)setTimeout(()=>{if(state==='ready'&&!modal.classList.contains('show')){onlineFrom='ready';renderLogin();const back=document.getElementById('close-online');back.textContent='PLAY AS GUEST';back.onclick=()=>{try{localStorage.setItem('fishy-v8-welcome-dismissed','1')}catch(e){}leaveOnline()}}},250)}

requestAnimationFrame(loop);
})();
